            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'Только что';
            const date = typeof timestamp === 'number' ? new Date(timestamp) : new Date(timestamp);
            return date.toLocaleTimeString();
        }

        // ================================================
        // 3. МОБИЛЬНОЕ МЕНЮ
        // ================================================

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        function initMobileMenu() {
            const menuToggle = document.querySelector('.chat-header .menu-toggle');
            const isMobile = window.innerWidth <= 768;
            if (menuToggle) {
                menuToggle.style.display = isMobile ? 'block' : 'none';
            }
        }

        // ================================================
        // 4. ДАННЫЕ И АВТОРИЗАЦИЯ
        // ================================================

        let currentUser = null;
        let currentImageView = null;
        let currentSort = 'newest';
        let privateChatWith = null;

        function initData() {
            let users = localStorage.getItem('roma_users');
            if (!users) {
                localStorage.setItem('roma_users', JSON.stringify([]));
                window.appUsers = [];
            } else {
                window.appUsers = JSON.parse(users);
            }
        }

        function saveUsers() {
            localStorage.setItem('roma_users', JSON.stringify(window.appUsers));
        }

        // ================================================
        // 5. АВТОРИЗАЦИЯ
        // ================================================

        function showAuthModal() {
            document.getElementById('authModal').classList.add('active');
        }

        function hideAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            const isLogin = document.getElementById('authSubmitBtn').textContent === 'Войти';
            
            if (isLogin) {
                const user = window.appUsers.find(u => u.username === username && u.password === password);
                if (user) {
                    currentUser = user;
                    hideAuthModal();
                    loadUserData();
                    showView('chat');
                    listenMessages();
                    listenPrivateMessages();
                    listenIncomingCalls();
                    showNotification('Добро пожаловать в Roma!', 'success');
                    closeMobileMenu();
                } else {
                    showNotification('Неверное имя пользователя или пароль', 'error');
                }
            } else {
                if (window.appUsers.find(u => u.username === username)) {
                    showNotification('Пользователь уже существует', 'error');
                    return;
                }
                const newUser = {
                    id: Date.now().toString(),
                    username,
                    password,
                    avatar: getAnonymousAvatar(username),
                    status: 'Новый пользователь!',
                    bio: 'Привет! Я здесь, чтобы общаться! 😊',
                    clan: '',
                    online: true,
                    lastSeen: new Date(),
                    wins: 0,
                    losses: 0,
                    totalTrophies: 0,
                    friends: []
                };
                window.appUsers.push(newUser);
                saveUsers();
                currentUser = newUser;
                hideAuthModal();
                loadUserData();
                showView('chat');
                listenMessages();
                listenPrivateMessages();
                listenIncomingCalls();
                showNotification('Регистрация успешна!', 'success');
                closeMobileMenu();
            }
        }

        // ================================================
        // 6. ПРОФИЛЬ
        // ================================================

        function loadUserData() {
            document.getElementById('userStatusBadge').textContent = currentUser.username + ' (Онлайн)';
            renderProfile();
        }

        function renderProfile() {
            const clanDisplay = currentUser.clan ? 
                `<div class="profile-clan-display ${currentUser.clan}">⚔️ Клан: ${currentUser.clan}</div>` : 
                '<div class="profile-clan-display" style="background: #ecf0f1; color: #7f8c8d; border: 1px solid #ddd;">Без клана</div>';
            
            const avatarStyle = currentUser.avatar && !currentUser.avatar.startsWith('data:image/svg') ? 
                `background-image: url('${currentUser.avatar}'); background-size: cover; background-position: center;` : 
                `background: ${getColorFromName(currentUser.username)};`;
            
            const profileHtml = `
                <div class="profile-card">
                    <div class="profile-avatar-main" style="${avatarStyle} display: flex; align-items: center; justify-content: center; font-size: 40px; color: white;">
                        ${currentUser.avatar && !currentUser.avatar.startsWith('data:image/svg') ? '' : currentUser.username.charAt(0).toUpperCase()}
                    </div>
                    <h2 class="profile-name">${currentUser.username}</h2>
                    ${clanDisplay}
                    <p class="profile-status">${currentUser.status || 'Нет статуса'}</p>
                    ${currentUser.bio ? `<div style="background: #f5f7fa; padding: 10px; border-radius: 12px; margin: 10px 0; font-style: italic; color: #555; font-size: 13px;">${escapeHtml(currentUser.bio)}</div>` : ''}
                    <button class="edit-profile-btn" onclick="openEditProfile()">
                        <i class="fas fa-edit"></i> Редактировать
                    </button>
                </div>
            `;
            document.getElementById('profileContent').innerHTML = profileHtml;
        }

        window.openEditProfile = function() {
            document.getElementById('editName').value = currentUser.username;
            document.getElementById('editStatus').value = currentUser.status || '';
            document.getElementById('editBio').value = currentUser.bio || '';
            document.getElementById('editClan').value = currentUser.clan || '';
            document.getElementById('editProfileModal').classList.add('active');
        };

        document.getElementById('editProfileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newName = document.getElementById('editName').value.trim();
            const newStatus = document.getElementById('editStatus').value.trim();
            const newBio = document.getElementById('editBio').value.trim();
            const newClan = document.getElementById('editClan').value;
            const avatarFile = document.getElementById('editAvatarFile').files[0];
            
            if (!newName) {
                showNotification('Имя не может быть пустым!', 'error');
                return;
            }
            
            currentUser.username = newName;
            currentUser.status = newStatus;
            currentUser.bio = newBio;
            currentUser.clan = newClan;
            
            if (avatarFile) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentUser.avatar = event.target.result;
                    saveUserData();
                };
                reader.readAsDataURL(avatarFile);
            } else {
                if (currentUser.avatar && currentUser.avatar.startsWith('data:image/svg')) {
                    currentUser.avatar = getAnonymousAvatar(newName);
                }
                saveUserData();
            }
        });

        function saveUserData() {
            const userIndex = window.appUsers.findIndex(u => u.id === currentUser.id);
            if (userIndex !== -1) {
                window.appUsers[userIndex] = { ...currentUser };
            }
            saveUsers();
            loadUserData();
            document.getElementById('editProfileModal').classList.remove('active');
            showNotification('Профиль обновлен!', 'success');
        }

        // ================================================
        // 7. ОТКРЫТИЕ ПРОФИЛЯ ПОЛЬЗОВАТЕЛЯ
        // ================================================

        window.openUserProfile = function(userId) {
            if (!userId) {
                showNotification('Ошибка: пользователь не найден', 'error');
                return;
            }
            
            const user = window.appUsers.find(u => u.id === userId);
            if (!user) {
                showNotification('Пользователь не найден', 'error');
                return;
            }
            
            const isOwnProfile = user.id === currentUser.id;
            const avatar = user.avatar || getAnonymousAvatar(user.username);
            const isFriend = currentUser.friends && currentUser.friends.includes(user.id);
            
            const clanDisplay = user.clan ? 
                `<div class="profile-clan ${user.clan}">⚔️ Клан: ${user.clan}</div>` : 
                '<div class="profile-clan" style="background: #ecf0f1; color: #7f8c8d; border: 1px solid #ddd;">Без клана</div>';
            
            const wins = user.wins || 0;
            const losses = user.losses || 0;
            const totalBattles = wins + losses;
            const winRate = totalBattles > 0 ? Math.round((wins / totalBattles) * 100) : 0;
            
            const profileHtml = `
                <div class="profile-card">
                    <div class="profile-avatar" style="background: ${getColorFromName(user.username)}; width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white; margin: 0 auto 15px; border: 4px solid #1E88E5; background-image: url('${avatar}'); background-size: cover; background-position: center;">
                        ${avatar && !avatar.startsWith('data:image/svg') ? '' : user.username.charAt(0).toUpperCase()}
                    </div>
                    <h2 class="profile-name">${escapeHtml(user.username)}</h2>
                    ${clanDisplay}
                    <p class="profile-status">${escapeHtml(user.status || 'Нет статуса')}</p>
                    ${user.bio ? `<div class="profile-bio">${escapeHtml(user.bio)}</div>` : ''}
                    <div class="profile-stats">
                        <div>
                            <div class="number">${user.totalTrophies || 0}</div>
                            <div class="label">🏆 Трофеи</div>
                        </div>
                        <div>
                            <div class="number">${wins}</div>
                            <div class="label">✅ Победы</div>
                        </div>
                        <div>
                            <div class="number">${winRate}%</div>
                            <div class="label">📊 Винрейт</div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        ${!isOwnProfile ? `
                            <button class="message-btn" onclick="goToPrivateChat('${user.id}')">
                                💬 Личные
                            </button>
                            <button class="call-btn-modal" onclick="startPrivateCall('audio')">
                                📞
                            </button>
                            <button class="friend-btn" onclick="${isFriend ? `removeFriend('${user.id}')` : `addFriend('${user.id}')`}">
                                ${isFriend ? '❤️ В друзьях' : '🤝 Добавить'}
                            </button>
                            <button class="close-btn" onclick="closeUserProfile()">
                                ✕
                            </button>
                        ` : `
                            <button class="close-btn" onclick="closeUserProfile()" style="flex: 1;">
                                Закрыть
                            </button>
                        `}
                    </div>
                </div>
            `;
            
            document.getElementById('userProfileContent').innerHTML = profileHtml;
            document.getElementById('userProfileModal').classList.add('active');
            closeMobileMenu();
        };

        window.openUserProfileFromChat = function() {
            if (privateChatWith) {
                openUserProfile(privateChatWith);
            } else {
                showNotification('Нет выбранного пользователя', 'info');
            }
        };

        window.closeUserProfile = function() {
            document.getElementById('userProfileModal').classList.remove('active');
        };

        window.goToPrivateChat = function(userId) {
            closeUserProfile();
            if (userId) {
                startPrivateChat(userId);
            } else {
                showNotification('Ошибка: пользователь не найден', 'error');
            }
        };

        // ================================================
        // 8. ДРУЗЬЯ
        // ================================================

        function addFriend(userId) {
            if (!currentUser.friends) currentUser.friends = [];
            if (currentUser.friends.includes(userId)) {
                showNotification('Уже в друзьях!', 'info');
                return;
            }
            currentUser.friends.push(userId);
            saveUsers();
            showNotification('Пользователь добавлен в друзья! ❤️', 'success');
            openUserProfile(userId);
        }

        function removeFriend(userId) {
            if (!currentUser.friends) return;
            currentUser.friends = currentUser.friends.filter(id => id !== userId);
            saveUsers();
            showNotification('Пользователь удалён из друзей', 'info');
            openUserProfile(userId);
        }

        // ================================================
        // 9. ПОИСК
        // ================================================

        function searchUsers() {
            const query = document.getElementById('searchUsers').value.trim().toLowerCase();
            const results = document.getElementById('searchResults');
            
            if (!query) {
                results.innerHTML = '';
                return;
            }
            
            const users = window.appUsers.filter(u => 
                u.id !== currentUser.id && 
                u.username.toLowerCase().includes(query)
            );
            
            if (users.length === 0) {
                results.innerHTML = '<div style="padding: 10px; color: #999; font-size: 13px; text-align: center;">👤 Пользователи не найдены</div>';
                return;
            }
            
            results.innerHTML = users.map(user => {
                const isFriend = currentUser.friends && currentUser.friends.includes(user.id);
                return `
                    <div class="user-list-item" onclick="openUserProfile('${user.id}')">
                        <img src="${user.avatar || getAnonymousAvatar(user.username)}" alt="">
                        <div>
                            <div class="name">${escapeHtml(user.username)} ${isFriend ? '❤️' : ''}</div>
                            <div class="online-status ${user.online ? 'online' : ''}">${user.online ? '🟢 Онлайн' : '⚫ Оффлайн'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ================================================
        // 10. ЛИЧНЫЕ СООБЩЕНИЯ
        // ================================================

        const privateMessagesRef = database.ref('privateMessages');

        function startPrivateChat(userId) {
            if (!userId) {
                showNotification('Ошибка: пользователь не найден', 'error');
                return;
            }
            
            const user = window.appUsers.find(u => u.id === userId);
            if (!user) {
                showNotification('Пользователь не найден', 'error');
                return;
            }
            
            privateChatWith = userId;
            document.getElementById('privateUserName').textContent = user.username;
            document.getElementById('privateAvatar').src = user.avatar || getAnonymousAvatar(user.username);
            document.getElementById('privateInput').disabled = false;
            document.getElementById('sendPrivateBtn').disabled = false;
            
            document.getElementById('audioCallBtn').style.display = 'flex';
            document.getElementById('videoCallBtn').style.display = 'flex';
            
            const badge = document.getElementById('privateBadge');
            badge.style.display = 'none';
            badge.textContent = '0';
            
            showView('private');
            renderPrivateMessages();
            document.getElementById('searchUsers').value = '';
            document.getElementById('searchResults').innerHTML = '';
            closeMobileMenu();
        }

        function sendPrivateMessage(text, imageData = null) {
            if (!text.trim() && !imageData) return;
            if (!currentUser || !privateChatWith) return;
            
            const chatId = [currentUser.id, privateChatWith].sort().join('_');
            const messageData = {
                from: currentUser.id,
                to: privateChatWith,
                username: currentUser.username,
                avatar: currentUser.avatar,
                text: text.trim() || '',
                image: imageData || null,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                deleted: false
            };
            
            privateMessagesRef.child(chatId).push(messageData);
            document.getElementById('privateInput').value = '';
        }

        function sendPrivateImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                sendPrivateMessage('📷 Фото', e.target.result);
                showNotification('Фото отправлено! 📸', 'success');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function listenPrivateMessages() {
            privateMessagesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    let unreadCount = 0;
                    for (const [chatId, messages] of Object.entries(data)) {
                        const ids = chatId.split('_');
                        if (ids.includes(currentUser.id)) {
                            const otherId = ids.find(id => id !== currentUser.id);
                            if (otherId && privateChatWith !== otherId) {
                                const messagesArray = Object.values(messages);
                                const lastMessage = messagesArray[messagesArray.length - 1];
                                if (lastMessage && lastMessage.from === otherId && !lastMessage.deleted) {
                                    unreadCount++;
                                }
                            }
                        }
                    }
                    
                    const badge = document.getElementById('privateBadge');
                    if (unreadCount > 0) {
                        badge.textContent = unreadCount;
                        badge.style.display = 'block';
                    } else {
                        badge.style.display = 'none';
                    }
                }
                renderPrivateMessages();
            });
        }

        function renderPrivateMessages() {
            const container = document.getElementById('privateMessages');
            if (!container || !privateChatWith) return;
            
            const chatId = [currentUser.id, privateChatWith].sort().join('_');
            privateMessagesRef.child(chatId).orderByChild('timestamp').once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<div style="text-align:center; padding:20px; color:#999; font-size:14px;">Нет сообщений. Напишите первое! 💬</div>';
                    return;
                }
                
                const messagesArray = Object.entries(data).map(([key, value]) => ({ ...value, firebaseKey: key }));
                messagesArray.sort((a, b) => a.timestamp - b.timestamp);
                
                const messagesHtml = messagesArray.map(msg => {
                    if (msg.deleted) return '';
                    
                    const isOwn = msg.from === currentUser.id;
                    const avatar = msg.avatar || getAnonymousAvatar(msg.username);
                    
                    let contentHtml = '';
                    if (msg.image) {
                        contentHtml += `<img src="${msg.image}" class="message-image" onclick="openImagePreview('${msg.image}')">`;
                    }
                    if (msg.text) {
                        contentHtml += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
                    }
                    
                    const userId = msg.from || '';
                    
                    return `
                        <div class="message ${isOwn ? 'own' : ''}" data-key="${msg.firebaseKey}">
                            <img src="${avatar}" alt="" class="message-avatar" onclick="${userId ? `openUserProfile('${userId}')` : ''}">
                            <div class="message-content">
                                <div class="message-header">
                                    <span class="message-name" onclick="${userId ? `openUserProfile('${userId}')` : ''}">${escapeHtml(msg.username)}</span>
                                    <span class="message-time">${formatTime(msg.timestamp)}</span>
                                </div>
                                ${contentHtml}
                            </div>
                            ${isOwn ? `
                                <div class="message-actions">
                                    <button class="delete-btn" onclick="deleteMessage('${msg.firebaseKey}', '${chatId}')" title="Удалить сообщение">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).filter(html => html !== '').join('');
                
                container.innerHTML = messagesHtml;
                container.scrollTop = container.scrollHeight;
            });
        }

        function deleteMessage(key, chatId) {
            if (!confirm('Удалить это сообщение?')) return;
            privateMessagesRef.child(chatId).child(key).update({
                deleted: true,
                text: 'Сообщение удалено',
                image: null
            });
            showNotification('Сообщение удалено', 'info');
        }

        // ================================================
        // 11. ОБЩИЙ ЧАТ
        // ================================================

        const chatMessagesRef = database.ref('chatMessages');

        function sendMessageToChat(text, imageData = null) {
            if (!text.trim() && !imageData) return;
            if (!currentUser) return;
            
            const messageData = {
                userId: currentUser.id,
                username: currentUser.username,
                avatar: currentUser.avatar,
                text: text.trim() || '',
                image: imageData || null,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                deleted: false
            };
            
            chatMessagesRef.push(messageData);
            document.getElementById('chatInput').value = '';
        }

        function sendChatImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                sendMessageToChat('📷 Фото', e.target.result);
                showNotification('Фото отправлено! 📸', 'success');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function listenMessages() {
            chatMessagesRef.orderByChild('timestamp').limitToLast(100).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const messagesArray = Object.entries(data).map(([key, value]) => ({ ...value, firebaseKey: key }));
                    renderChatMessages(messagesArray);
                } else {
                    renderChatMessages([]);
                }
            });
        }

        function renderChatMessages(messages) {
            messages.sort((a, b) => a.timestamp - b.timestamp);
            
            const container = document.getElementById('chatMessages');
            if (!container) return;
            
            const messagesHtml = messages.map(msg => {
                if (msg.deleted) return '';
                
                const isOwn = msg.userId === currentUser.id;
                const avatar = msg.avatar || getAnonymousAvatar(msg.username);
                
                let contentHtml = '';
                if (msg.image) {
                    contentHtml += `<img src="${msg.image}" class="message-image" onclick="openImagePreview('${msg.image}')">`;
                }
                if (msg.text) {
                    contentHtml += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
                }
                
                const userId = msg.userId || '';
                
                return `
                    <div class="message ${isOwn ? 'own' : ''}" data-key="${msg.firebaseKey}">
                        <img src="${avatar}" alt="${msg.username}" class="message-avatar" onclick="${userId ? `openUserProfile('${userId}')` : ''}">
                        <div class="message-content">
                            <div class="message-header">
                                <span class="message-name" onclick="${userId ? `openUserProfile('${userId}')` : ''}">${escapeHtml(msg.username)}</span>
                                <span class="message-time">${formatTime(msg.timestamp)}</span>
                            </div>
                            ${contentHtml}
                        </div>
                        ${isOwn ? `
                            <div class="message-actions">
                                <button class="delete-btn" onclick="deleteChatMessage('${msg.firebaseKey}')" title="Удалить сообщение">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).filter(html => html !== '').join('');
            
            container.innerHTML = messagesHtml || '<div style="text-align:center; padding:20px; color:#999; font-size:14px;">Нет сообщений. Напишите первое! 💬</div>';
            container.scrollTop = container.scrollHeight;
        }

        function deleteChatMessage(key) {
            if (!confirm('Удалить это сообщение?')) return;
            chatMessagesRef.child(key).update({
                deleted: true,
                text: 'Сообщение удалено',
                image: null
            });
            showNotification('Сообщение удалено', 'info');
        }

        function openImagePreview(imageData) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.9);
                z-index: 3000;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            `;
            modal.innerHTML = `
                <img src="${imageData}" style="max-width: 90%; max-height: 90%; border-radius: 12px;">
            `;
            modal.onclick = () => modal.remove();
            document.body.appendChild(modal);
        }

        // ================================================
        // 12. ЗВОНКИ
        // ================================================

        let peerConnection = null;
        let localStream = null;
        let remoteStream = null;
        let callType = 'audio';
        let isIncomingCall = false;
        let isGroupCall = false;

        const callRef = database.ref('calls');

        function startPrivateCall(type) {
            if (!privateChatWith) {
                showNotification('Сначала выберите пользователя!', 'error');
                return;
            }
            isGroupCall = false;
            initiateCall(type, privateChatWith);
        }

        function startGroupCall(type) {
            isGroupCall = true;
            const users = window.appUsers.filter(u => u.id !== currentUser.id);
            if (users.length === 0) {
                showNotification('Нет других пользователей для звонка', 'error');
                return;
            }
            const targetUser = users[0];
            initiateCall(type, targetUser.id);
            showNotification(`Звонок пользователю ${targetUser.username}...`, 'info');
        }

        function initiateCall(type, targetUserId) {
            callType = type;
            const user = window.appUsers.find(u => u.id === targetUserId);
            
            document.getElementById('callAvatar').src = user.avatar || getAnonymousAvatar(user.username);
            document.getElementById('callName').textContent = user.username + (isGroupCall ? ' (Общий чат)' : '');
            document.getElementById('callStatus').textContent = 'Звонит...';
            document.getElementById('acceptCallBtn').style.display = 'none';
            document.getElementById('callModal').classList.add('active');
            document.getElementById('callVideoContainer').style.display = type === 'video' ? 'flex' : 'none';

            if (!navigator.mediaDevices) {
                showNotification('Ваш браузер не поддерживает звонки', 'error');
                return;
            }

            const constraints = type === 'video' ? 
                { audio: true, video: true } : 
                { audio: true, video: false };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    localStream = stream;
                    if (type === 'video') {
                        document.getElementById('localVideo').srcObject = stream;
                    }
                    createCallOffer(targetUserId);
                })
                .catch(err => {
                    showNotification('Не удалось получить доступ к микрофону/камере', 'error');
                    endCall();
                });
        }

        function createCallOffer(targetUserId) {
            const configuration = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            };

            peerConnection = new RTCPeerConnection(configuration);
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                remoteStream = event.streams[0];
                document.getElementById('remoteVideo').srcObject = remoteStream;
            };

            peerConnection.createOffer()
                .then(offer => {
                    return peerConnection.setLocalDescription(offer);
                })
                .then(() => {
                    const chatId = [currentUser.id, targetUserId].sort().join('_');
                    const callData = {
                        from: currentUser.id,
                        to: targetUserId,
                        type: callType,
                        offer: peerConnection.localDescription,
                        status: 'ringing',
                        timestamp: firebase.database.ServerValue.TIMESTAMP,
                        isGroup: isGroupCall
                    };
                    callRef.child(chatId).set(callData);
                    
                    callRef.child(chatId).on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data && data.answer && data.status === 'connected') {
                            const answer = new RTCSessionDescription(data.answer);
                            peerConnection.setRemoteDescription(answer);
                            document.getElementById('callStatus').textContent = 'В разговоре...';
                            callRef.child(chatId).off();
                        }
                        if (data && data.status === 'ended') {
                            endCall();
                        }
                    });
                })
                .catch(err => {
                    showNotification('Ошибка соединения', 'error');
                    endCall();
                });
        }

        function acceptCall() {
            isIncomingCall = false;
            document.getElementById('acceptCallBtn').style.display = 'none';
            document.getElementById('callStatus').textContent = 'Соединение...';

            const chatId = [currentUser.id, privateChatWith].sort().join('_');
            
            const constraints = callType === 'video' ? 
                { audio: true, video: true } : 
                { audio: true, video: false };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    localStream = stream;
                    if (callType === 'video') {
                        document.getElementById('localVideo').srcObject = stream;
                    }
                    
                    const configuration = {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' }
                        ]
                    };

                    peerConnection = new RTCPeerConnection(configuration);
                    
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });

                    peerConnection.ontrack = (event) => {
                        remoteStream = event.streams[0];
                        document.getElementById('remoteVideo').srcObject = remoteStream;
                    };

                    callRef.child(chatId).once('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data && data.offer) {
                            const offer = new RTCSessionDescription(data.offer);
                            peerConnection.setRemoteDescription(offer)
                                .then(() => {
                                    return peerConnection.createAnswer();
                                })
                                .then(answer => {
                                    return peerConnection.setLocalDescription(answer);
                                })
                                .then(() => {
                                    callRef.child(chatId).update({
                                        answer: peerConnection.localDescription,
                                        status: 'connected'
                                    });
                                    document.getElementById('callStatus').textContent = 'В разговоре...';
                                });
                        }
                    });

                    callRef.child(chatId).on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data && data.status === 'ended') {
                            endCall();
                        }
                    });
                })
                .catch(err => {
                    showNotification('Не удалось получить доступ к микрофону/камере', 'error');
                    endCall();
                });
        }

        function endCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            const chatId = privateChatWith ? [currentUser.id, privateChatWith].sort().join('_') : null;
            if (chatId) {
                callRef.child(chatId).update({ status: 'ended' });
                callRef.child(chatId).off();
            }
            
            document.getElementById('callModal').classList.remove('active');
            document.getElementById('callVideoContainer').style.display = 'none';
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            isIncomingCall = false;
        }

        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('muteBtn').innerHTML = audioTrack.enabled ? 
                        '<i class="fas fa-microphone"></i>' : 
                        '<i class="fas fa-microphone-slash"></i>';
                }
            }
        }

        function listenIncomingCalls() {
            callRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.to === currentUser.id && data.status === 'ringing') {
                    isIncomingCall = true;
                    privateChatWith = data.from;
                    callType = data.type;
                    isGroupCall = data.isGroup || false;
                    
                    const user = window.appUsers.find(u => u.id === data.from);
                    if (user) {
                        document.getElementById('callAvatar').src = user.avatar || getAnonymousAvatar(user.username);
                        document.getElementById('callName').textContent = user.username + (isGroupCall ? ' (Общий чат)' : '');
                        document.getElementById('callStatus').textContent = 'Входящий звонок...';
                        document.getElementById('acceptCallBtn').style.display = 'flex';
                        document.getElementById('callModal').classList.add('active');
                        document.getElementById('callVideoContainer').style.display = callType === 'video' ? 'flex' : 'none';
                    }
                }
            });
        }

        // ================================================
        // 13. ГАЛЕРЕЯ
        // ================================================

        function renderGallery() {
            let images = JSON.parse(localStorage.getItem('roma_images') || '[]');
            let comments = JSON.parse(localStorage.getItem('roma_comments') || '[]');
            
            let sortedImages = [...images];
            if (currentSort === 'newest') {
                sortedImages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            } else if (currentSort === 'popular') {
                sortedImages.sort((a, b) => (b.likes?.length || 0) - (a.likes?.length || 0));
            }
            
            const galleryHtml = sortedImages.map(img => `
                <div class="gallery-item" onclick="openImageModal('${img.id}')">
                    <img src="${img.data}" alt="${img.title}">
                    <div class="gallery-item-info">
                        <div class="gallery-item-title">${escapeHtml(img.title)}</div>
                        <div class="gallery-item-stats">
                            <span><i class="fas fa-heart"></i> ${img.likes?.length || 0}</span>
                            <span><i class="fas fa-comment"></i> ${comments.filter(c => c.imageId === img.id).length}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('galleryGrid').innerHTML = galleryHtml || '<div style="text-align:center; padding:30px; grid-column: 1/-1; color:#999; font-size:14px;">Нет загруженных изображений</div>';
        }

        window.openImageModal = function(imageId) {
            let images = JSON.parse(localStorage.getItem('roma_images') || '[]');
            let comments = JSON.parse(localStorage.getItem('roma_comments') || '[]');
            const image = images.find(i => i.id === imageId);
            if (!image) return;
            
            currentImageView = image;
            document.getElementById('modalImage').src = image.data;
            document.getElementById('modalTitle').textContent = image.title;
            document.getElementById('modalDescription').textContent = image.description;
            document.getElementById('modalLikes').textContent = image.likes?.length || 0;
            
            const imageComments = comments.filter(c => c.imageId === imageId);
            const commentsHtml = imageComments.map(comment => `
                <div class="comment-item">
                    <strong>${escapeHtml(comment.username)}</strong>
                    <p>${escapeHtml(comment.text)}</p>
                    <small style="color: #999;">${new Date(comment.timestamp).toLocaleString()}</small>
                </div>
            `).join('');
            
            document.getElementById('modalComments').innerHTML = commentsHtml || '<p>Нет комментариев</p>';
            document.getElementById('imageModal').classList.add('active');
        };

        document.getElementById('modalLikeBtn').addEventListener('click', () => {
            if (!currentImageView) return;
            let images = JSON.parse(localStorage.getItem('roma_images') || '[]');
            const imageIndex = images.findIndex(i => i.id === currentImageView.id);
            
            if (imageIndex !== -1) {
                if (!images[imageIndex].likes) images[imageIndex].likes = [];
                if (!images[imageIndex].likes.includes(currentUser.id)) {
                    images[imageIndex].likes.push(currentUser.id);
                    localStorage.setItem('roma_images', JSON.stringify(images));
                    document.getElementById('modalLikes').textContent = images[imageIndex].likes.length;
                    renderGallery();
                    showNotification('Вы поставили лайк! ❤️', 'success');
                } else {
                    showNotification('Вы уже лайкнули это фото', 'info');
                }
            }
        });

        document.getElementById('addCommentBtn').addEventListener('click', () => {
            const commentText = document.getElementById('commentInput').value.trim();
            if (!commentText || !currentImageView) return;
            
            let comments = JSON.parse(localStorage.getItem('roma_comments') || '[]');
            const comment = {
                id: Date.now().toString(),
                imageId: currentImageView.id,
                userId: currentUser.id,
                username: currentUser.username,
                text: commentText,
                timestamp: new Date()
            };
            
            comments.push(comment);
            localStorage.setItem('roma_comments', JSON.stringify(comments));
            document.getElementById('commentInput').value = '';
            openImageModal(currentImageView.id);
            showNotification('Комментарий добавлен!', 'success');
        });

        document.getElementById('uploadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const file = document.getElementById('imageFile').files[0];
            const title = document.getElementById('imageTitle').value;
            const description = document.getElementById('imageDescription').value;
            
            if (file && title && description) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    let images = JSON.parse(localStorage.getItem('roma_images') || '[]');
                    const image = {
                        id: Date.now().toString(),
                        userId: currentUser.id,
                        username: currentUser.username,
                        title: title,
                        description: description,
                        data: event.target.result,
                        timestamp: new Date(),
                        likes: []
                    };
                    images.push(image);
                    localStorage.setItem('roma_images', JSON.stringify(images));
                    renderGallery();
                    document.getElementById('uploadModal').classList.remove('active');
                    showNotification('Изображение загружено! 📸', 'success');
                };
                reader.readAsDataURL(file);
            }
        });

        // ================================================
        // 14. НАВИГАЦИЯ
        // ================================================

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.getElementById(`${viewId}View`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const targetNav = document.querySelector(`[data-view="${viewId}"]`);
            if (targetNav) targetNav.classList.add('active');
            
            if (viewId === 'gallery') renderGallery();
            
            if (viewId !== 'private') {
                document.getElementById('audioCallBtn').style.display = 'none';
                document.getElementById('videoCallBtn').style.display = 'none';
            }
            
            closeMobileMenu();
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // ================================================
        // 15. ИНИЦИАЛИЗАЦИЯ
        // ================================================

        function initEvents() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const view = item.dataset.view;
                    if (view === 'private') {
                        if (!privateChatWith) {
                            document.getElementById('privateUserName').textContent = 'Выберите пользователя';
                            document.getElementById('privateAvatar').src = '';
                            document.getElementById('privateInput').disabled = true;
                            document.getElementById('sendPrivateBtn').disabled = true;
                            document.getElementById('audioCallBtn').style.display = 'none';
                            document.getElementById('videoCallBtn').style.display = 'none';
                            document.getElementById('privateMessages').innerHTML = `
                                <div style="text-align:center; padding:20px; color:#999; font-size:14px;">
                                    Найдите пользователя в поиске слева и начните общение 💬
                                </div>
                            `;
                        }
                    }
                    showView(view);
                    closeMobileMenu();
                });
            });
            
            document.getElementById('sendMessageBtn').addEventListener('click', () => {
                const input = document.getElementById('chatInput');
                if (input.value.trim()) {
                    sendMessageToChat(input.value);
                    input.value = '';
                }
            });
            
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('sendMessageBtn').click();
                }
            });
            
            document.getElementById('sendPrivateBtn').addEventListener('click', () => {
                const input = document.getElementById('privateInput');
                if (input.value.trim() && privateChatWith) {
                    sendPrivateMessage(input.value);
                    input.value = '';
                }
            });
            
            document.getElementById('privateInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('sendPrivateBtn').click();
                }
            });
            
            document.getElementById('uploadImageBtn').addEventListener('click', () => {
                document.getElementById('uploadModal').classList.add('active');
            });
            
            document.querySelectorAll('.close, .modal').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('close') || e.target.classList.contains('modal')) {
                        e.target.closest('.modal').classList.remove('active');
                    }
                });
            });
            
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSort = btn.dataset.sort;
                    renderGallery();
                });
            });
            
            document.getElementById('logoutBtn').addEventListener('click', () => {
                currentUser = null;
                privateChatWith = null;
                localStorage.removeItem('roma_current_user');
                showAuthModal();
                showView('chat');
                closeMobileMenu();
            });
            
            document.getElementById('toggleAuthBtn').addEventListener('click', () => {
                const isLogin = document.getElementById('authSubmitBtn').textContent === 'Войти';
                if (isLogin) {
                    document.getElementById('authSubmitBtn').textContent = 'Зарегистрироваться';
                    document.getElementById('toggleAuthBtn').textContent = 'Уже есть аккаунт? Войти';
                    document.getElementById('authTitle').textContent = 'Регистрация в Roma';
                } else {
                    document.getElementById('authSubmitBtn').textContent = 'Войти';
                    document.getElementById('toggleAuthBtn').textContent = 'Нет аккаунта? Зарегистрироваться';
                    document.getElementById('authTitle').textContent = 'Вход в Roma';
                }
            });
            
            document.getElementById('authForm').addEventListener('submit', handleAuth);
            
            initMobileMenu();
            window.addEventListener('resize', initMobileMenu);
        }

        function checkAuth() {
            const savedUser = localStorage.getItem('roma_current_user');
            if (savedUser) {
                const savedUserData = JSON.parse(savedUser);
                const updatedUser = window.appUsers.find(u => u.id === savedUserData.id);
                if (updatedUser) {
                    currentUser = updatedUser;
                    loadUserData();
                    showView('chat');
                    listenMessages();
                    listenPrivateMessages();
                    listenIncomingCalls();
                } else {
                    showAuthModal();
                }
            } else {
                showAuthModal();
            }
        }

        // ================================================
        // 16. ЗАПУСК
        // ================================================

        document.addEventListener('DOMContentLoaded', function() {
            initData();
            initEvents();
            checkAuth();
            renderGallery();
        });

        window.addEventListener('beforeunload', () => {
            if (currentUser) {
                localStorage.setItem('roma_current_user', JSON.stringify(currentUser));
            }
            endCall();
        });
    </script>
</body>
